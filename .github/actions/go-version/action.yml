name: Determine Go Version
description: >
    Determines the Go version to use from go.mod: the minor version given there
    with the latest patch release (e.g. "go 1.27.0" becomes "1.27.x").
    Requires the repository to be checked out. Go itself does not need to be
    installed, go.mod is parsed directly.

inputs:
    go-mod:
        description: Path to the go.mod file
        required: false
        default: go.mod

outputs:
    version:
        description: Go version specification for actions/setup-go, e.g. "1.27.x"
        value: ${{ steps.gover.outputs.version }}

runs:
    using: composite
    steps:
      - name: Determine Go Version
        id: gover
        shell: bash
        env:
            GO_MOD: ${{ inputs.go-mod }}
        run: |
            MINOR=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' "$GO_MOD")
            if [ -z "$MINOR" ]; then
                echo "::error::could not determine Go version from $GO_MOD"
                exit 1
            fi
            echo "Using Go version $MINOR.x"
            echo "version=$MINOR.x" >> "$GITHUB_OUTPUT"
