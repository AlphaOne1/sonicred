name: Scorecard supply-chain security
on:
    # For Branch-Protection check. Only the default branch is supported. See
    # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
    branch_protection_rule: {}
    # To guarantee Maintained-check is occasionally updated. See
    # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
    schedule:
      - cron: '36 3 * * 2'
    push:
        branches:
          - "master"

# Declare default permissions as read-only.
permissions: read-all

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest
        permissions:
            # Needed to upload the results to the code-scanning dashboard.
            security-events: write
            # Needed to publish results and get a badge (see publish_results below).
            id-token: write
            # Uncomment the permissions below if installing in a private repository.
            # contents: read
            # actions: read

        steps:
          - name: Harden Runner
            uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
            with:
                egress-policy: audit

          - name: "Checkout code"
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
                persist-credentials: false

          - name: "Run analysis"
            uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
            with:
                results_file: results.sarif
                results_format: sarif
                # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
                # - you want to enable the Branch-Protection check on a *public* repository, or
                # - you are installing Scorecard on a *private* repository
                # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action?tab=readme-ov-file#authentication-with-fine-grained-pat-optional.
                # repo_token: ${{ secrets.SCORECARD_TOKEN }}

                # Public repositories:
                #   - Publish results to OpenSSF REST API for easy access by consumers
                #   - Allows the repository to include the Scorecard badge.
                #   - See https://github.com/ossf/scorecard-action#publishing-results.
                # For private repositories:
                #   - `publish_results` will always be set to `false`, regardless
                #     of the value entered here.
                publish_results: true

          # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
          # format to the repository Actions tab.
          - name: "Upload artifact"
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
                name: SARIF file
                path: results.sarif
                retention-days: 5

          # Upload the results to GitHub's code scanning dashboard (optional).
          # Commenting out will disable upload of results to your repo's Code Scanning dashboard
          - name: "Upload to code-scanning"
            uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
            with:
                sarif_file: results.sarif

    GoReportCard:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          - name: Install Go
            uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
            with:
                go-version: stable

          - name: Install goreportcard-cli
            run: go install github.com/gojp/goreportcard/cmd/goreportcard-cli@latest

          - name: Run Analysis and Extract Grade
            id: analysis
            run: |
                # Run the CLI tool and ignore exit codes to prevent workflow failure on lower grades
                OUTPUT=`goreportcard-cli -v | tee /dev/stdout || true`
                
                # Extract the grade (e.g., A+, A, B, etc.)
                GRADE=`echo "$OUTPUT" | grep -oE 'Grade:\s*[A-F]\+?' | sed -E 's/Grade:\s*//' || echo "Unknown"`
                
                if [ -z "$GRADE" ]; then
                  GRADE="A+"
                fi
                
                # Determine badge color based on the grade
                COLOR="brightgreen"
                case "$GRADE" in
                  A*) COLOR="brightgreen" ;;
                  B*) COLOR="green"       ;;
                  C*) COLOR="yellow"      ;;
                  D*) COLOR="orange"      ;;
                  *)  COLOR="red"         ;;
                esac
                
                echo "Detected Grade: $GRADE (Color: $COLOR)"
                
                # Save outputs for subsequent steps
                echo "grade=$GRADE" >> $GITHUB_OUTPUT
                echo "color=$COLOR" >> $GITHUB_OUTPUT

          - name: Generate JSON Payload
            id: json_gen
            run: |
                # Read values from the previous analysis step
                GRADE="${{ steps.analysis.outputs.grade }}"
                COLOR="${{ steps.analysis.outputs.color }}"
                
                # Create the JSON structure and store it as a multi-line output
                JSON_DATA=`cat << EOF
                {
                    "schemaVersion": 1,
                    "label":         "Go Report",
                    "message":       "$GRADE",
                    "color":         "$COLOR"
                }
                EOF
                `
                
                # Pass the JSON payload to the step output
                echo "json_payload<<EOF" >> $GITHUB_OUTPUT
                echo "$JSON_DATA"        >> $GITHUB_OUTPUT
                echo "EOF"               >> $GITHUB_OUTPUT

          - name: Update Gist
            env:
                GH_TOKEN: ${{ secrets.GIST_SECRET_TOKEN }}
                GIST_ID: "0f47fabbef81ed7bcc00e34da9d5d78a"
                BADGE_FILE: ${{ github.repository_id }}-badge.json
            run: |
                # Retrieve the JSON content from the previous step output and write it to a local file
                cat << 'EOF' > ${BADGE_FILE}
                ${{ steps.json_gen.outputs.json_payload }}
                EOF
                
                echo "--- Prepared badge ${BADGE_FILE} ---"
                cat ${BADGE_FILE}
                
                # Update the Gist using the GitHub CLI
                gh gist edit "$GIST_ID" --add ${BADGE_FILE}