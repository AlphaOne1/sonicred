apiVersion: v1
kind:       ConfigMap
metadata:
    name: {{ include "monitoring.fullname" . }}-dashboards
    labels:
        {{- include "monitoring.labels" . | nindent 8 }}
        # This label tells the Grafana sidecar to load this ConfigMap
        grafana_dashboard: "1"
data:
    {{- (.Files.Glob "dashboards/*.json").AsConfig | nindent 4 }}
