apiVersion: v1
kind: ConfigMap
metadata:
    # The alloy chart cannot template the ConfigMap name, so it must match alloy.alloy.configMap.name in
    # values.yaml. Because of this fixed name, only one release per namespace is possible.
    name: alloy-collector-config
    labels:
        {{- include "monitoring.labels" . | nindent 8 }}
data:
    config: |
        // OTLP receiver for metrics, logs and traces
        otelcol.receiver.otlp "default" {
            grpc { endpoint = "0.0.0.0:4317" }
            http { endpoint = "0.0.0.0:4318" }
            output {
                metrics = [otelcol.exporter.prometheus.vmetrics.input]
                logs    = [otelcol.exporter.otlphttp.vlogs.input]
                traces  = [otelcol.exporter.otlphttp.vtraces.input]
            }
        }

        // forwarding to VictoriaMetrics
        otelcol.exporter.prometheus "vmetrics" {
            forward_to = [prometheus.remote_write.vmetrics.receiver]
        }

        prometheus.remote_write "vmetrics" {
            endpoint {
                url = "http://{{ include "monitoring.victoriaServer" (dict "ctx" . "alias" "metrics") }}:8428/api/v1/write"
            }
        }

        // forwarding to VictoriaLogs via OTLP/HTTP (VictoriaLogs does not accept OTLP/gRPC)
        otelcol.exporter.otlphttp "vlogs" {
            client {
                endpoint = "http://{{ include "monitoring.victoriaServer" (dict "ctx" . "alias" "logs") }}:9428/insert/opentelemetry"
            }
        }

        // forwarding to VictoriaTraces via OTLP/HTTP (OTLP/gRPC would need a separate, explicitly enabled port)
        otelcol.exporter.otlphttp "vtraces" {
            client {
                endpoint = "http://{{ include "monitoring.victoriaServer" (dict "ctx" . "alias" "traces") }}:10428/insert/opentelemetry"
            }
        }
