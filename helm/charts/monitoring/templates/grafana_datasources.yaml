{{- include "monitoring.validateGrafanaAdmin" . }}
apiVersion: v1
kind:       ConfigMap
metadata:
    name: {{ include "monitoring.fullname" . }}-datasources
    labels:
        {{- include "monitoring.labels" . | nindent 8 }}
        # This label tells the Grafana sidecar to load this ConfigMap
        grafana_datasource: "1"
data:
    datasources.yaml: |
        apiVersion: 1
        datasources:
            -   name:      VictoriaMetrics
                uid:       victoriametrics
                type:      victoriametrics-metrics-datasource
                url:       http://{{ include "monitoring.victoriaServer" (dict "ctx" . "alias" "metrics") }}:8428
                access:    proxy
                isDefault: true
            -   name:   VictoriaLogs
                uid:    victorialogs
                type:   victoriametrics-logs-datasource
                url:    http://{{ include "monitoring.victoriaServer" (dict "ctx" . "alias" "logs") }}:9428
                access: proxy
            -   name:   VictoriaTraces
                uid:    victoriatraces
                type:   jaeger
                url:    http://{{ include "monitoring.victoriaServer" (dict "ctx" . "alias" "traces") }}:10428/select/jaeger
                access: proxy
