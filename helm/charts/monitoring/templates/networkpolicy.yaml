# Alloy: Accessible only from pods within the same namespace
apiVersion: networking.k8s.io/v1
kind:       NetworkPolicy
metadata:
    name: {{ include "monitoring.fullname" . }}-alloy-ingress
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: alloy
    policyTypes:
        - Ingress
    ingress:
        -   from:
                -   podSelector: { } # Allows all pods in the same namespace (e.g., SonicRed)
            # only OTLP, the Alloy UI (12345) stays reachable via kubectl port-forward
            ports:
                -   protocol: TCP
                    port:     4317
                -   protocol: TCP
                    port:     4318

---
# Victoria Instances: Access restricted to Alloy (Write) and Grafana (Read)
apiVersion: networking.k8s.io/v1
kind:       NetworkPolicy
metadata:
    name: {{ include "monitoring.fullname" . }}-victoria-access
spec:
    podSelector:
        matchExpressions:
            -   key:      app.kubernetes.io/name
                operator: In
                values:
                    - metrics
                    - logs
                    - vt-single
    policyTypes:
        - Ingress
    ingress:
        -   from:
                -   podSelector:
                        matchLabels:
                            app.kubernetes.io/name: alloy
                -   podSelector:
                        matchLabels:
                            app.kubernetes.io/name: grafana
---
# Grafana: Allow access via Ingress
apiVersion: networking.k8s.io/v1
kind:       NetworkPolicy
metadata:
    name: {{ include "monitoring.fullname" . }}-grafana-ingress
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: grafana
    policyTypes:
        - Ingress
    ingress:
        -   from:
                {{- toYaml .Values.networkPolicy.grafana.from | nindent 16 }}
            ports:
                -   protocol: TCP
                    port:     3000
