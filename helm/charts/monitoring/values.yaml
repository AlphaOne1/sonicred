networkPolicy:
    grafana:
        # Sources allowed to reach Grafana on port 3000. The default allows access from everywhere, as Grafana is
        # meant to be reachable once deployed. Note that an empty list also allows access from everywhere, as this is
        # the meaning of an empty source list in Kubernetes. To restrict access, e.g., to the namespace of the ingress
        # controller:
        #   from:
        #       -   namespaceSelector:
        #               matchLabels:
        #                   kubernetes.io/metadata.name: ingress-nginx
        from:
            -   ipBlock:
                    cidr: 0.0.0.0/0
            # ipBlock does not reliably cover pod traffic (e.g. ingress controllers), depending on the CNI
            -   namespaceSelector: { }

grafana:
#    fullnameOverride: "monitoring-grafana"
    sidecar:
        datasources:
            enabled: true
            # This label is important! The sidecar looks for it.
            label: grafana_datasource
        dashboards:
            enabled: true
            # This label is important! The sidecar looks for it.
            label: grafana_dashboard
    plugins:
        - victoriametrics-metrics-datasource
        - victoriametrics-logs-datasource

alloy:
#    fullnameOverride: "monitoring-alloy"
    alloy:
        # opens the OTLP ports on the kubernetes service
        extraPorts:
            -   name:       otlp-grpc
                port:       4317
                targetPort: 4317
                protocol:   TCP
            -   name:       otlp-http
                port:       4318
                targetPort: 4318
                protocol:   TCP
        configMap:
            create:  false
            name:    alloy-collector-config
            key:     config
        # Alloy only receives OTLP here and does not need host access, so it can run without root privileges.
        # 473 is the alloy user of the image.
        securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
                drop:
                    - ALL
            runAsNonRoot: true
            runAsUser:    473
            runAsGroup:   473
            seccompProfile:
                type: RuntimeDefault
        # writable storage path (alloy.storagePath) for the read-only root filesystem
        mounts:
            extra:
                -   name:      alloy-storage
                    mountPath: /tmp/alloy
    controller:
        volumes:
            extra:
                -   name:     alloy-storage
                    emptyDir: { }

metrics:
#    fullnameOverride: "monitoring-metrics"
    server:
        persistentVolume:
            enabled: false
        extraArgs:
            retentionPeriod: 24h

logs:
#    fullnameOverride: "monitoring-logs"
    server:
        persistentVolume:
            enabled: false
        retentionPeriod: 1d # minimum allowed by VictoriaLogs
    # Logs are shipped by Alloy. Must be disabled explicitly, the default of the subchart is not
    # applied to the dependency condition.
    vector:
        enabled: false

traces:
#    fullnameOverride: "monitoring-traces"
    server:
        persistentVolume:
            enabled: false
        retentionPeriod: 1d # minimum allowed by VictoriaTraces
