apiVersion: v1
kind: Service
metadata:
    name: {{ include "SonicRed.fullname" . }}
    labels:
        {{- include "SonicRed.labels" . | nindent 8 }}
spec:
    type: {{ .Values.service.type }}
    ports:
        -   port: 8080
            targetPort: http
            protocol: TCP
            name: http
        -   port: 8081
            targetPort: metrics
            protocol: TCP
            name: metrics
    selector:
        {{- include "SonicRed.selectorLabels" . | nindent 8 }}
