apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "SonicRed.fullname" . }}
    labels:
        {{- include "SonicRed.labels" . | nindent 8 }}
spec:
    {{- if not .Values.autoscaling.enabled }}
    replicas: {{ .Values.replicaCount }}
    {{- end }}
    selector:
        matchLabels:
            {{- include "SonicRed.selectorLabels" . | nindent 12 }}
    template:
        metadata:
            {{- with .Values.podAnnotations }}
            annotations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            labels:
                {{- include "SonicRed.labels" . | nindent 16 }}
                {{- with .Values.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
        spec:
            {{- with .Values.imagePullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            serviceAccountName: {{ include "SonicRed.serviceAccountName" . }}
            securityContext:
                {{- toYaml .Values.podSecurityContext | nindent 16 }}
            containers:
                -   name: {{ .Chart.Name }}
                    securityContext:
                        {{- toYaml .Values.securityContext | nindent 24 }}
                    image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
                    imagePullPolicy: {{ .Values.image.pullPolicy }}
                    ports:
                        -   name: http
                            containerPort: 8080
                            protocol: TCP
                        -   name: metrics
                            containerPort: 8081
                            protocol: TCP
                {{- if .Values.monitoring.enabled }}
                    env:
                        -   name: POD_NAME
                            valueFrom:
                                fieldRef:
                                    fieldPath: metadata.name
                        -   name: POD_NAMESPACE
                            valueFrom:
                                fieldRef:
                                    fieldPath: metadata.namespace
                        # service.instance.id becomes the instance label of the metrics
                        -   name: OTEL_RESOURCE_ATTRIBUTES
                            value: service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
                        -   name: OTEL_LOGS_EXPORTER
                            value: otlp
                        -   name: OTEL_METRICS_EXPORTER
                            value: otlp
                        -   name: OTEL_TRACES_EXPORTER
                            value: otlp
                        -   name: OTEL_EXPORTER_OTLP_PROTOCOL
                            value: grpc
                        -   name: OTEL_EXPORTER_OTLP_ENDPOINT
                            value: http://{{ include "SonicRed.alloyHost" . }}:4317
                {{- end }}
                    livenessProbe:
                        {{- toYaml .Values.livenessProbe | nindent 24 }}
                    readinessProbe:
                        {{- toYaml .Values.readinessProbe | nindent 24 }}
                    resources:
                        {{- toYaml .Values.resources | nindent 24 }}
                {{- with .Values.volumeMounts }}
                    volumeMounts:
                        {{- toYaml . | nindent 24 }}
                {{- end }}
            {{- with .Values.volumes }}
            volumes:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
