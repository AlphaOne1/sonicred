apiVersion: v1
kind: Pod
metadata:
    name: "{{ include "SonicRed.fullname" . }}-test-connection"
    labels:
        {{- include "SonicRed.labels" . | nindent 8 }}
    annotations:
        "helm.sh/hook": test
spec:
    containers:
      - name: wget
        image: busybox
        command: ['wget']
        # the response is discarded, as the root filesystem is read-only
        args: ['-q', '-O', '/dev/null', '{{ include "SonicRed.fullname" . }}:8080']
        securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
    restartPolicy: Never
